ci-fix__assert-changed: "1 file changed"
ci-delta-scope: '{"moved":true}'
ci-recheck__mode: '{"continuation":true,"head":"fixturehead","cursor":"fixtureprior","risks":"fixture-owned-policy","execution":{"path":"ci-recheck__mode","invocation":{"loopPath":[]}}}'
