# Dry-run fixture: the external review gate is on, Copilot's first review was
# clean, and a late introduced CI red was fixed after it. The CI fix moved the
# head, so the new head gets a verification-only Copilot review before the
# re-wait, and the ready check binds the flip to that head.
impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented and green"
impl__assert-changed: "3 files changed"
# gate-green, gate-validated, and gate-ci-fix are deliberately unstubbed: the
# real gates must accept this run at every gate it reaches.
pr__pr: { intent: "/fixture/pr-intent.json" }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 9, url: "https://github.com/example/repo/pull/9", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
review-policy: { risks: "fixture-owned-policy" }
classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
resolve-scope: '{"errors":"false"}'
review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy","execution":{"path":"review__mode","invocation":{"loopPath":[]}}}'
review__coverage: { full: true }
review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 9 }
review__code: "0 findings"
review__simplify__simplify: { findings: false }
review__seams: "0 findings"
shape__simplify: { findings: false }
review__tests: "0 findings"
review__synthesize:
